[build-system]
requires = ["setuptools>=69", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "unitsml"
version = "0.1.0"
description = "Exact native UnitsML quantity operations"
requires-python = ">=3.9"
license = {file = "LICENSE.md"}
readme = "README.md"
dependencies = ["asciiunits==0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
